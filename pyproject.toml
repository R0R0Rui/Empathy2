[project]
name = "empathy-ai-backend"
version = "0.1.0"
description = "FastAPI backend for an emotion-aware empathy AI agent."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "torch==2.10.0+cu128",
    "torchvision==0.25.0+cu128",
    "torchaudio==2.10.0+cu128",
    "transformers>=4.50",
    "sentencepiece>=0.2",
    "safetensors>=0.4",
    "peft>=0.13",
    "accelerate>=0.30",
    "bitsandbytes",
    "unsloth",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
