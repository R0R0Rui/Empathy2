<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Empathy AI</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>Empathy AI</span>
        </div>
        <button class="icon-button" id="restartButton" type="button" title="Restart conversation" aria-label="Restart conversation">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
            <path d="M21 3v6h-6" />
          </svg>
        </button>
      </header>

      <section class="messages" id="messages" aria-live="polite">
        <div class="empty-state" id="emptyState">
          <h1>What’s on your mind?</h1>
        </div>
      </section>

      <form class="composer" id="chatForm">
        <textarea id="messageInput" name="message" rows="1" placeholder="Message Empathy AI" autocomplete="off"></textarea>
        <button class="send-button" id="sendButton" type="submit" aria-label="Send message" title="Send">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M12 19V5" />
            <path d="m5 12 7-7 7 7" />
          </svg>
        </button>
      </form>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
